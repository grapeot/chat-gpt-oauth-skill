[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chat-gpt-oauth-skill"
version = "0.1.0"
description = "ChatGPT/Codex OAuth 中文 skill 与最小 reference implementation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "grapeot" }]
dependencies = []

[project.urls]
Repository = "https://github.com/grapeot/chat-gpt-oauth-skill"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.scripts]
chatgpt-oauth = "chat_gpt_oauth.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_gpt_oauth"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
